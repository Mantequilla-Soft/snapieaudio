<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="3speak Audio Player - Lightweight voice message and audio player">
  <title>3speak Audio Player</title>
  <link rel="stylesheet" href="/styles/audio-styles.css">
</head>
<body>
  <div id="audio-player-container">
    <!-- Playlist embed (/play?list=<id>): the playlist, previous / next, and below the player every track -->
    <div id="playlist-head" style="display: none;">
      <img id="playlist-cover" alt="" width="40" height="40">
      <div id="playlist-info">
        <a id="playlist-name" href="https://3speak.tv" target="_blank" rel="noopener"></a>
        <span id="playlist-meta"></span>
      </div>
      <button id="prev-btn" class="control-btn playlist-skip" aria-label="Previous track" title="Previous track">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="next-btn" class="control-btn playlist-skip" aria-label="Next track" title="Next track">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div id="player-header">
      <span id="audio-title">Loading...</span>
    </div>
    
    <div id="player-controls">
      <button id="play-pause-btn" class="control-btn" aria-label="Play/Pause">
        <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" style="display: none;">
          <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
        </svg>
      </button>
      
      <div id="waveform-container"></div>

      <!-- A sponsored spot while it plays: takes the waveform's place, so the embed never changes height -->
      <div id="ad-strip" style="display: none;">
        <span class="ad-label">Ad</span>
        <span class="ad-text"><strong class="ad-product"></strong> <span class="ad-message"></span></span>
        <a class="ad-more" href="https://3speak.tv" target="_blank" rel="noopener noreferrer sponsored" style="display: none;">Find out more <span aria-hidden="true">↗</span></a>
      </div>
      
      <div id="time-display">
        <span id="current-time">0:00</span>
        <span class="time-separator">/</span>
        <span id="total-time">0:00</span>
      </div>
      
      <!-- Speed and volume share one column of small chips, so the row stays as wide as before -->
      <div id="side-chips">
        <button id="speed-btn" class="control-btn" aria-label="Playback speed">
          1x
        </button>

        <div id="volume-wrap">
          <button id="volume-btn" class="control-btn" aria-label="Mute" title="Mute (M)">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path class="vol-high" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              <path class="vol-low" d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z" style="display: none;"/>
              <path class="vol-off" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" style="display: none;"/>
            </svg>
          </button>
          <!-- The slider opens to the left, over the time display, so the embed never grows -->
          <div id="volume-pop">
            <input id="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
          </div>
        </div>
      </div>

      <a id="tip-btn" class="control-btn" href="https://3speak.tv" target="_blank" rel="noopener" aria-label="Tip the creator" title="Tip the creator" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 7v14"/><path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"/><rect x="3" y="7" width="18" height="4" rx="1"/>
        </svg>
      </a>

      <!-- After the spot: its link, for the rest of the track -->
      <a id="ad-more-btn" class="control-btn" href="https://3speak.tv" target="_blank" rel="noopener noreferrer sponsored" style="display: none;">
        <span class="ad-label">Ad</span><span class="ad-more-text">Find out more</span><span aria-hidden="true">↗</span>
      </a>
    </div>
    
    <div id="error-message" style="display: none;">
      Failed to load audio. Please try again.
    </div>
    
    <div id="loading-spinner" style="display: none;">
      Loading audio...
    </div>

    <!-- Above the track list: sort by date (oldest first unless ?sort=desc) -->
    <div id="playlist-bar" style="display: none;">
      <span class="playlist-bar-label">Tracks</span>
      <div class="playlist-bar-tools">
        <div id="playlist-pager" style="display: none;">
          <button id="page-prev" type="button" class="page-btn" aria-label="Previous page" title="Previous page">
            <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
          </button>
          <span id="page-info" aria-live="polite">1 / 1</span>
          <button id="page-next" type="button" class="page-btn" aria-label="Next page" title="Next page">
            <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.6 7.4l4.6 4.6-4.6 4.6L10 18l6-6z"/></svg>
          </button>
        </div>
        <select id="sort-select" aria-label="Sort tracks by date">
          <option value="asc">Oldest first</option>
          <option value="desc">Newest first</option>
        </select>
      </div>
    </div>
    <ol id="playlist-tracks" style="display: none;"></ol>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="/js/listen-time.js"></script>
  <script src="/js/audio-ad.js"></script>
  <script src="/js/audio-player.js"></script>
</body>
</html>
